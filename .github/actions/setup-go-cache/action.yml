name: Setup Go with workload cache
description: Restore Go modules and build objects, then save a fresh cache after a successful job.

inputs:
  go-version-file:
    description: Go version file relative to the repository root.
    default: go.mod
  go-version:
    description: Optional Go version override.
    default: ""
  check-latest:
    description: Resolve the latest Go release satisfying the requested version.
    default: "false"
  workload:
    description: Additional cache identity for matrix jobs or reusable workflow inputs.
    default: ""
  cache-dependency-path:
    description: Dependency file patterns used to invalidate the cache.
    default: |
      **/go.mod
      **/go.sum
      **/go.work
      **/go.work.sum

outputs:
  go-version:
    description: The installed Go version.
    value: ${{ steps.go.outputs.go-version }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      id: go
      with:
        go-version-file: ${{ inputs.go-version-file }}
        go-version: ${{ inputs.go-version }}
        check-latest: ${{ inputs.check-latest }}
        cache: false

    - name: Resolve Go cache identity
      id: cache
      shell: bash
      env:
        CACHE_WORKFLOW: ${{ github.workflow }}
        CACHE_JOB: ${{ github.job }}
        CACHE_WORKLOAD: ${{ inputs.workload }}
      run: |
        hash_identity() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum
          else
            shasum -a 256
          fi
        }
        identity=$(printf '%s\n' "$CACHE_WORKFLOW" "$CACHE_JOB" "$CACHE_WORKLOAD" | hash_identity | cut -c1-16)
        version=$(go env GOVERSION)
        build_cache=$(go env GOCACHE)
        module_cache=$(go env GOMODCACHE)
        {
          echo "identity=$identity"
          echo "version=$version"
          echo "build=$build_cache"
          echo "modules=$module_cache"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Go modules and build cache
      # The run suffix avoids immutable exact hits that freeze the first
      # successful cache. actions/cache saves in its success-only post step.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.cache.outputs.build }}
          ${{ steps.cache.outputs.modules }}
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache.outputs.version }}-${{ steps.cache.outputs.identity }}-${{ hashFiles(inputs.cache-dependency-path) }}-${{ github.run_id }}-${{ github.run_attempt }}
        # PR-only workloads can seed from another default-branch job;
        # Go validates reused objects by content, toolchain and build flags.
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache.outputs.version }}-${{ steps.cache.outputs.identity }}-${{ hashFiles(inputs.cache-dependency-path) }}-
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache.outputs.version }}-${{ steps.cache.outputs.identity }}-
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache.outputs.version }}-
