name: Artifact storage
on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
defaults:
  run:
    shell: bash
concurrency:
  group: artifact-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ashtonian/go-ci-actions/.github/workflows/artifact-consumer.yml@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
    with:
      runner: arc-technitium-configurator
    secrets:
      CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
