name: Artifact storage
on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
defaults:
  run:
    shell: bash
concurrency:
  group: artifact-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ashtonian/go-ci-actions/.github/workflows/artifact-consumer.yml@ce77d25782e078b8e9a5d4ed2e6c53c4ae54927c # v1.6.4
    with:
      runner: arc-technitium-configurator
    secrets:
      CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
