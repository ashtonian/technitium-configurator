name: Test, Build, Push & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}

# A pull request's run ends by recording a receipt of the tested merge tree
# (go-ci-actions acceptance). The push to main that merges it skips the
# checks that passed on the same tree and only builds and pushes the beta
# image. Tags run everything.
jobs:
  acceptance:
    name: reuse pull request validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor_id == '4212452'
    runs-on: arc-technitium-configurator
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      reused: ${{ steps.verify.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: verify
        uses: ashtonian/go-ci-actions/acceptance@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          mode: verify
          variables: ${{ toJSON(vars) }}
  test:
    needs: acceptance
    # !cancelled() runs the job when acceptance is skipped, as on pull requests and tags.
    if: ${{ !cancelled() && needs.acceptance.outputs.reused != 'true' && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: arc-technitium-configurator
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version-file: go.mod

      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./e2e

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --build-tags e2e

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  e2e:
    name: e2e (Technitium ${{ matrix.server }})
    # Exercise standalone and clustered servers on both supported patch versions.
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-technitium-configurator
    needs: test
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: "15.6.1"
            image: technitium/dns-server:15.6.1@sha256:e5474007d142d509c7de0d855132e3f0469bd6d5d77abf23dff5dad4e2975d09
          - server: "15.6.2"
            image: technitium/dns-server:15.6.2@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245
    env:
      DNS_SERVER_IMAGE: ${{ matrix.image }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version-file: go.mod

      - name: End-to-end tests
        run: go test -tags e2e -v -count=1 -timeout 20m ./e2e/...
  # Pull requests build linux/amd64 only and push nothing, without
  # attestations; main and tags build both platforms and push them with
  # provenance and an SBOM. The binaries are cross-compiled on the runner with
  # its remote build cache, checked, and copied into the image as they are.
  build-and-push:
    # Runs after the tests pass, or without them when acceptance reused them.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: arc-technitium-configurator
    needs: [ test, e2e ]
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version-file: go.mod

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=auto tags only semver releases without a prerelease suffix.
          flavor: |
            latest=auto
          tags: |
            # Release tags (only on v* tag push)
            # {{version}} comes first: the first tag is the version the
            # binary and the image label report ("3.0.0", not "v3.0.0").
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            # Beta tags (on main branch push or manual dispatch)
            type=raw,value=beta,enable={{is_default_branch}}
            type=raw,value=beta-{{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}
            # Pull requests (built, never pushed): gives the binary a version
            type=ref,event=pr

      - name: Cross-compile the binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_DATE: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
        run: |
          IFS=, read -r -a platforms <<<"$PLATFORMS"
          scripts/build-binaries.sh "$RUNNER_TEMP/image" "${VERSION:-dev}" "$GITHUB_SHA" "$BUILD_DATE" "${platforms[@]}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The arm64 image once shipped an x86-64 binary (#4). Check each
      # platform's binary, the one the image will hold, before anything is
      # pushed.
      - name: Verify binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # A release must report its tag without the "v", whatever
          # metadata-action derived; other builds report the metadata version.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            expected="${VERSION:-dev}"
          fi
          IFS=, read -r -a platforms <<<"$PLATFORMS"
          scripts/verify-binaries.sh "$RUNNER_TEMP/image" "$expected" "${platforms[@]}"

      - name: Login to DockerHub
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: artifact-build-1
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
      - name: Preserve Docker build record
        if: always() && (steps.artifact-build-1.outcome == 'success' || steps.artifact-build-1.outcome == 'failure')
        timeout-minutes: 5
        uses: ashtonian/go-ci-actions/build-record@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          metadata: ${{ steps.artifact-build-1.outputs.metadata }}

  accepted:
    name: record validation
    needs: [ test, e2e, build-and-push ]
    # Without a status function this runs only when every need succeeded.
    if: github.event_name == 'pull_request'
    runs-on: arc-technitium-configurator
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions/acceptance@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          mode: record
          results: ${{ toJSON(needs) }}
          variables: ${{ toJSON(vars) }}

  release:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && (startsWith(github.ref, 'refs/tags/v'))
    needs: build-and-push
    runs-on: arc-technitium-configurator
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # RELEASE_NOTES.md holds every version; publish only this tag's section
      # ("## v3.0.0"). A prerelease such as v3.0.0-rc.1 uses its own section
      # when present, otherwise the section of the version it precedes.
      - name: Extract release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          extract() {
            awk -v heading="## $1" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { lines[++n] = $0 }
              END {
                while (n > 0 && (lines[n] ~ /^[[:space:]]*$/ || lines[n] == "---")) n--
                for (i = 1; i <= n; i++) print lines[i]
              }' RELEASE_NOTES.md
          }
          notes="$RUNNER_TEMP/release-notes.md"
          extract "$TAG" > "$notes"
          if [[ ! -s "$notes" ]]; then
            extract "${TAG%%-*}" > "$notes"
          fi
          if [[ -s "$notes" ]]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_NOTES.md has no section for $TAG; using generated notes"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
