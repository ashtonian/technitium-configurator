name: Test, Build, Push & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-technitium-configurator
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ashtonian/go-ci-actions@78710c0215622d4dd362f4c565de788934051488 # v1.1.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./e2e

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --build-tags e2e

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  e2e:
    # Runs the configurator against real Technitium servers (single node and
    # a two-node cluster) pinned in e2e/docker-compose*.yaml.
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-technitium-configurator
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ashtonian/go-ci-actions@78710c0215622d4dd362f4c565de788934051488 # v1.1.0
        with:
          go-version-file: go.mod

      - name: End-to-end tests
        run: go test -tags e2e -v -count=1 -timeout 20m ./e2e/...
  build-and-push:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-technitium-configurator
    needs: [ test, e2e ]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=auto tags only semver releases without a prerelease suffix.
          flavor: |
            latest=auto
          tags: |
            # Release tags (only on v* tag push)
            # {{version}} comes first: the first tag is the version the
            # binary and the image label report ("3.0.0", not "v3.0.0").
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            # Beta tags (on main branch push or manual dispatch)
            type=raw,value=beta,enable={{is_default_branch}}
            type=raw,value=beta-{{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}
            # Pull requests (built, never pushed): gives the binary a version
            type=ref,event=pr

      - name: Restore Docker Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-cache
          key: docker-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            docker-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}-
            docker-go-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore BuildKit Go caches
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance
          cache-map: |
            {
              ".build-cache/go-build": "/root/.cache/go-build",
              ".build-cache/go-mod": "/go/pkg/mod"
            }

      # The arm64 image once shipped an x86-64 binary (#4). Build each
      # platform's binary with the publishing step's inputs and check its
      # architecture and version before anything is pushed. The build is
      # reproducible, so the push below reuses these layers from the cache.
      - name: Build binaries for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=out
          cache-from: type=gha,scope=technitium-configurator
          cache-to: type=gha,mode=max,scope=technitium-configurator
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

      - name: Verify binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # A release must report its tag without the "v", whatever
          # metadata-action derived; other builds report the metadata version.
          # The Dockerfile falls back to "dev" when no version is given.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            expected="${VERSION:-dev}"
          fi
          scripts/verify-binaries.sh out "$expected"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=technitium-configurator
          cache-to: type=gha,mode=max,scope=technitium-configurator
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          provenance: mode=max
          sbom: true

  release:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && (startsWith(github.ref, 'refs/tags/v'))
    needs: build-and-push
    runs-on: arc-technitium-configurator
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # RELEASE_NOTES.md holds every version; publish only this tag's section
      # ("## v3.0.0"). A prerelease such as v3.0.0-rc.1 uses its own section
      # when present, otherwise the section of the version it precedes.
      - name: Extract release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          extract() {
            awk -v heading="## $1" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { lines[++n] = $0 }
              END {
                while (n > 0 && (lines[n] ~ /^[[:space:]]*$/ || lines[n] == "---")) n--
                for (i = 1; i <= n; i++) print lines[i]
              }' RELEASE_NOTES.md
          }
          notes="$RUNNER_TEMP/release-notes.md"
          extract "$TAG" > "$notes"
          if [[ ! -s "$notes" ]]; then
            extract "${TAG%%-*}" > "$notes"
          fi
          if [[ -s "$notes" ]]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_NOTES.md has no section for $TAG; using generated notes"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
