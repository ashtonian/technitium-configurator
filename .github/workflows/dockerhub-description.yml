name: Docker Hub description

# Publishes .github/DOCKERHUB.md as the Docker Hub overview, with absolute
# links to the full documentation. The repository README uses relative links.
on:
  push:
    branches: [ main ]
    paths:
      - .github/DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-technitium-configurator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The token needs read, write and delete scope to edit the description.
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository }}
          short-description: "Declarative YAML bootstrap for Technitium DNS Server: settings, zones, records, apps, clusters"
          readme-filepath: ./.github/DOCKERHUB.md
