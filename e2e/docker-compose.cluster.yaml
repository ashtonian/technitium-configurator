networks:
  cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  dns-primary:
    image: ${DNS_SERVER_IMAGE:-technitium/dns-server:15.6.2@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245}
    ports:
      - "${DNS_PRIMARY_PORT}:5380/tcp"
    networks:
      cluster:
        ipv4_address: 172.28.0.10
    environment:
      - DNS_SERVER_DOMAIN=primary.cluster.local
    tmpfs:
      - /etc/dns
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5380'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  dns-secondary:
    image: ${DNS_SERVER_IMAGE:-technitium/dns-server:15.6.2@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245}
    ports:
      - "${DNS_SECONDARY_PORT}:5380/tcp"
      - "${DNS_SECONDARY_DNS_PORT}:53/udp"
    networks:
      cluster:
        ipv4_address: 172.28.0.11
    environment:
      - DNS_SERVER_DOMAIN=secondary.cluster.local
    tmpfs:
      - /etc/dns
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5380'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
