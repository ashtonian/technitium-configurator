---
apiVersion: v1
kind: ConfigMap
# The DNS config below contains a TSIG secret. In production, store a config
# with secrets (TSIG keys, user passwords, app credentials) in a Secret and
# mount that instead.
metadata:
  name: technitium-config
data:
  config.yaml: |-
    # Optional: cluster configuration (applied after DNS settings, so the
    # cluster's own TSIG key is added on top of yours). On a cluster primary,
    # zones join the cluster catalog by default and replicate to secondaries.
    # Secondary config is cluster-only.
    #
    # Primary (also set dnsServerDomain below to a name inside the cluster
    # domain, for example "dns.dns-cluster.example.com"):
    # cluster:
    #   mode: "primary"
    #   domain: "dns-cluster.example.com"
    #   nodeIPs: "10.0.0.1"
    #   configRefreshIntervalSeconds: 60
    #   heartbeatRefreshIntervalSeconds: 10
    #
    # Secondary (separate ConfigMap, no dnsSettings needed):
    # cluster:
    #   mode: "secondary"
    #   nodeIPs: "10.0.0.2"
    #   primaryURL: "https://primary-dns.example.com:53443"
    #   primaryIP: "10.0.0.1"
    #   primaryUsername: "admin"
    #   primaryPassword: "password"
    #   primaryTotp: ""          # join only; later runs need a primary user without 2FA
    #   ignoreCertErrors: false
    dnsSettings:
      dnsServerDomain: "technitium.somedomain.com"
      recursion: Deny
      logQueries: false
      loggingType: FileAndConsole
      useLocalTime: true
      maxLogFileDays: 7
      maxStatFileDays: 365
      enableDnsOverUdpProxy:  true
      enableDnsOverTcpProxy:  true
      enableDnsOverHttp:      true
      enableDnsOverTls:       true
      enableDnsOverHttps:     true
      enableDnsOverHttp3:     true
      enableDnsOverQuic:      true
      udpPayloadSize:         1232
      resolverConcurrency:    4
      forwarderConcurrency:   10
      forwarderTimeout:       2000
      forwarderRetries:       2
      concurrentForwarding:   true
      cacheMaximumEntries:    0
      serveStale:             true
      serveStaleTtl:          86400
      cacheNegativeRecordTtl: 60
      tsigKeys:
      - keyName: "external-dns"
        algorithmName: "hmac-sha256"
        sharedSecret: "cmVwbGFjZS13aXRoLWEtcmFuZG9tLWJhc2U2NC1zZWNyZXQ="   # base64; generate with: openssl rand -base64 32
    zones:
      - zone:  "somedomain.com"
        type:  "Forwarder"
        initializeForwarder: true
        protocol: "Udp"
        forwarder: "10.0.0.1"
        dnssecValidation: false
        aclSettings:
          queryAccess: AllowOnlyPrivateNetworks
          zoneTransfer: UseSpecifiedNetworkACL
          zoneTransferNetworkACL: ["10.0.0.0/8"]
          zoneTransferTsigKeyNames: ["external-dns"]
          update: "UseSpecifiedNetworkACL"
          updateNetworkACL:
            - "10.0.0.0/8"
          # tsigKeyName|domain|allowed types, repeated for each policy
          updateSecurityPolicies: "external-dns|*.somedomain.com|ANY|external-dns|somedomain.com|ANY"
      - zone:  "someotherdomain.com"
        type:  "Forwarder"
        initializeForwarder: true
        protocol: "Https"
        forwarder: "https://cloudflare-dns.com/dns-query"
        dnssecValidation: true
    records: [ ]
    apps:
      - name: "Advanced Blocking"
        url: "https://download.technitium.com/dns/apps/AdvancedBlockingApp-v11.2.1.zip"
        config:
          enableBlocking: true
          blockListUrlUpdateIntervalHours: 24
          networkGroupMap:
            "0.0.0.0/0":      "home"
            "::/0":           "home"
          groups:
            - name: home
              enableBlocking: true
              allowTxtBlockingReport: true
              blockAsNxDomain: true
              blockingAddresses: [ "0.0.0.0", "::" ]
              allowed: []
              blocked: []
              allowListUrls: []
              allowedRegex: []
              blockedRegex: []
              regexAllowListUrls: []
              regexBlockListUrls: []
              adblockListUrls: []
              blockListUrls:
                - "https://raw.githubusercontent.com/xRuffKez/NRD/refs/heads/main/lists/14-day/wildcard/nrd-14day_wildcard.txt"
                - "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt"
                - "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/doh-vpn-proxy-bypass-onlydomains.txt"
                - "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/doh-onlydomains.txt"
                - "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/nosafesearch-onlydomains.txt"
                - "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/dyndns-onlydomains.txt"
      - name: "Advanced Forwarding"
        url:  "https://download.technitium.com/dns/apps/AdvancedForwardingApp-v5.2.zip"
        config:
          enableForwarding: true
          forwarders:
            - name: "opendns"
              dnssecValidation: true
              forwarderProtocol: "Https"
              forwarderAddresses:
                - "https://doh.opendns.com/dns-query"
            - name: "cloudflare"
              dnssecValidation: true
              forwarderProtocol: "Tls"
              forwarderAddresses:
                - "tls://1.1.1.1"
                - "tls://1.0.0.1"
            - name: "quad9"
              dnssecValidation: true
              forwarderProtocol: "Https"
              forwarderAddresses:
                - "https://dns.quad9.net/dns-query"
          networkGroupMap:
            "0.0.0.0/0": "default"
            "::/0":      "default"
          groups:
            - name: "default"
              enableForwarding: true
              forwardings:
                - forwarders: ["opendns", "cloudflare", "quad9"]
                  domains: ["*"]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: technitium-credentials
spec:
  refreshInterval: 48h
  secretStoreRef:
    kind: ClusterSecretStore
    name: mysecretstore
  target:
    deletionPolicy: Delete
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: technitium-credentials/username
    - secretKey: password
      remoteRef:
        key: technitium-credentials/default_password
    - secretKey: new_password
      remoteRef:
        key: technitium-credentials/password
---
apiVersion: batch/v1
kind: Job
metadata:
  name: technitium-configurator
  # A Job runs once and its pod template cannot be changed. To apply an edited
  # config, delete the Job and apply it again. Under Argo CD, make it a sync
  # hook instead, so every sync re-runs it:
  # annotations:
  #   argocd.argoproj.io/hook: Sync
  #   argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: technitium-configurator
      # change-password runs first: create-token logs in with the new password.
      # Both are safe to re-run.
      initContainers:
      - name: change-password
        image: ashtonian/technitium-configurator:3.1.0
        args:
          - change-password
        env:
          - name: DNS_API_URL
            value: http://technitium:5380
          - name: DNS_USERNAME
            valueFrom:
              secretKeyRef:
                name: technitium-credentials
                key: username
          - name: DNS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: technitium-credentials
                key: password
          - name: DNS_NEW_PASSWORD
            valueFrom:
              secretKeyRef:
                name: technitium-credentials
                key: new_password
      - name: create-token
        image: ashtonian/technitium-configurator:3.1.0
        args: ["create-token"]
        env:
          - name: DNS_API_URL
            value: http://technitium:5380
          - name: DNS_USERNAME
            valueFrom:
              secretKeyRef:
                name: technitium-credentials
                key: username
          - name: DNS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: technitium-credentials
                key: new_password
          # Stored in the Job's own namespace, under the key api-token.
          - name: DNS_K8S_SECRET_NAME
            value: technitium-api-token
      containers:
      - name: technitium-configurator
        image: ashtonian/technitium-configurator:3.1.0
        args:
          - configure
          - /app/config.yaml
        env:
          - name: DNS_API_URL
            value: http://technitium:5380
          - name: DNS_USERNAME
            valueFrom:
              secretKeyRef:
                name: technitium-credentials
                key: username
          - name: DNS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: technitium-credentials
                key: new_password
        volumeMounts:
          - name: config-volume
            mountPath: /app/config.yaml
            subPath: config.yaml
      volumes:
      - name: config-volume
        configMap:
          name: technitium-config
      restartPolicy: OnFailure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: technitium-configurator
rules:
# create-token reads and updates only the token Secret. Kubernetes cannot
# scope "create" to a name, so it gets a separate rule; drop it if you
# pre-create the Secret.
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["technitium-api-token"]
  verbs: ["get", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: technitium-configurator
subjects:
- kind: ServiceAccount
  name: technitium-configurator
  namespace: default  # the namespace the Job runs in
roleRef:
  kind: Role
  name: technitium-configurator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: technitium-configurator
