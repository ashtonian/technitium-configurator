# Starts a Technitium DNS Server and configures it in order:
#   1. configurator-password changes the admin password set at first start
#   2. configurator-configure applies ./config.yaml (examples/config.yaml)
#
#   docker compose up -d
#   docker compose wait configurator-configure
#   docker compose logs configurator-password configurator-configure
#
# Then query it, or log in to http://localhost:5380 as admin / securepassword:
#   dig @127.0.0.1 -p 1053 +short www.example.com
#
# Both configurator steps are safe to re-run. To apply an edited config.yaml:
#   docker compose run --rm --no-deps configurator-configure
#
# A two-node cluster is in cluster/compose.yaml.

services:
  dns:
    image: technitium/dns-server:15.6.1
    ports:
      # Published on localhost:1053 so the example does not collide with a
      # local resolver on port 53. Publish "53:53" to serve a network.
      - "127.0.0.1:1053:53/tcp"
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:5380:5380/tcp"  # web console and API
    environment:
      - DNS_SERVER_DOMAIN=dns.example.com
      # Password of the admin user on first start only.
      - DNS_SERVER_ADMIN_PASSWORD=changeme
    volumes:
      - dns-data:/etc/dns
    healthcheck:
      # The DNS health check API answers without a token from loopback only.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:5380/api/dnsClient/healthCheck | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  configurator-password:
    image: ashtonian/technitium-configurator:3.1.0
    environment:
      - DNS_API_URL=http://dns:5380
      - DNS_USERNAME=admin
      - DNS_PASSWORD=changeme
      - DNS_NEW_PASSWORD=securepassword
    depends_on:
      dns:
        condition: service_healthy
    command: change-password

  configurator-configure:
    image: ashtonian/technitium-configurator:3.1.0
    environment:
      - DNS_API_URL=http://dns:5380
      - DNS_USERNAME=admin
      - DNS_PASSWORD=securepassword
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      configurator-password:
        condition: service_completed_successfully
    command: configure /app/config.yaml

volumes:
  dns-data:
